<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" role="img" aria-label="Separate utilities support intent, retrieval, evidence, and project validation; Show Your Work documents the workflows">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6E9BFF"/></marker><filter id="shadow" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity=".12"/></filter></defs>
<style>.node rect{fill:#161C26;stroke:#384153;stroke-width:1.4;filter:url(#shadow)}.name{fill:#6E9BFF;font-size:14px;font-weight:600}.sub{fill:#9AA5B8;font-size:11px}.label{fill:#9AA5B8;font-size:11px;letter-spacing:.12em}.flow{fill:none;stroke:#6E9BFF;stroke-width:2;marker-end:url(#arrow)}</style>
<rect x="6" y="6" width="988" height="278" rx="16" fill="#161C26" stroke="#29313F" stroke-width="1.5"/>
<text class="label" x="28" y="34">SKILLS COORDINATE THE WORK</text>
<g class="node"><rect x="28" y="49" width="206" height="58" rx="10"/><text class="name" x="44" y="73">Plan</text><text class="sub" x="44" y="93">understand + scope</text></g>
<path class="flow" d="M234,78 H268"/>
<g class="node"><rect x="274" y="49" width="206" height="58" rx="10"/><text class="name" x="290" y="73">Build</text><text class="sub" x="290" y="93">implement + repair</text></g>
<path class="flow" d="M480,78 H514"/>
<g class="node"><rect x="520" y="49" width="206" height="58" rx="10"/><text class="name" x="536" y="73">Review</text><text class="sub" x="536" y="93">independent gates</text></g>
<path class="flow" d="M726,78 H760"/>
<g class="node"><rect x="766" y="49" width="206" height="58" rx="10"/><text class="name" x="782" y="73">Ship</text><text class="sub" x="782" y="93">accept + publish</text></g>
<path d="M130,107 V133 H869 V107 M377,107 V133 M623,107 V133 M500,133 V151" fill="none" stroke="#384153" stroke-width="1.7"/>
<text class="label" x="28" y="164">SEPARATE TOOLS, USED BY SPECIFIC WORKFLOWS</text>
<g class="node"><rect x="28" y="182" width="206" height="58" rx="10"/><text class="name" x="44" y="206">Drift Ranger</text><text class="sub" x="44" y="226">intent + checkpoints</text></g>
<g class="node"><rect x="274" y="182" width="206" height="58" rx="10"/><text class="name" x="290" y="206">Find Again</text><text class="sub" x="290" y="226">optional retrieval</text></g>
<g class="node"><rect x="520" y="182" width="206" height="58" rx="10"/><text class="name" x="536" y="206">Citation Needed</text><text class="sub" x="536" y="226">evidence + scoring</text></g>
<g class="node"><rect x="766" y="182" width="206" height="58" rx="10"/><text class="name" x="782" y="206">dev-observatory</text><text class="sub" x="782" y="226">validation + diagnostics</text></g>
<text class="sub" x="28" y="268">Show Your Work documents the flows. Utilities are not bundled or automatically started.</text>
</svg>
