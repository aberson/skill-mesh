<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" role="img" aria-label="Plan-init or plan-feature, then plan-review, plan-redline and plan-wrap in order. Repo-sync and durable task-handoff prepare build-phase. Each build-step implements, checks, reviews by lane, and lands with finalization before the next step. Acceptance and repo-update follow.">
  <defs>
    <marker id="ar-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#384153"/></marker>
    <marker id="ar-s-dark" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6E9BFF"/></marker>
    <filter id="sh-dark" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,.5)"/></filter>
  </defs>
  <style>
    .bg{fill:#161C26;stroke:#29313F;stroke-width:1.5}
    .lnk{fill:none;stroke:#384153;stroke-width:1.7}
    .spine{fill:none;stroke:#6E9BFF;stroke-width:2.4}
    .node rect{fill:#161C26;stroke:#384153;stroke-width:1.4;filter:url(#sh-dark)}
    .pn{fill:#6E9BFF;font-size:13px;font-weight:600}
    .ps{fill:#9AA5B8;font-size:10.5px}
    .lbl{fill:#9AA5B8;font-size:11px;letter-spacing:.12em;font-weight:600}
    .cap{fill:#9AA5B8;font-size:10.5px}
  </style>
<rect class="bg" x="6" y="6" width="988" height="278" rx="16"/>

<text class="lbl" x="24" y="32">PLAN</text>
<text class="lbl" x="280" y="32">PREPARE</text>
<text class="lbl" x="536" y="32">BUILD</text>
<text class="lbl" x="792" y="32">SHIP</text>
<g class="node"><rect x="24" y="46" width="200" height="48" rx="10"/><text class="pn" x="38" y="67">plan-init / feature</text><text class="ps" x="38" y="85">new / existing project</text></g>
<g class="node"><rect x="24" y="108" width="200" height="30" rx="10"/><text class="pn" x="38" y="129">plan-review</text></g>
<g class="node"><rect x="24" y="152" width="200" height="30" rx="10"/><text class="pn" x="38" y="173">plan-redline</text></g>
<g class="node"><rect x="24" y="196" width="200" height="30" rx="10"/><text class="pn" x="38" y="217">plan-wrap</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M124,94 V108"/>
<path class="lnk" marker-end="url(#ar-dark)" d="M124,138 V152"/>
<path class="lnk" marker-end="url(#ar-dark)" d="M124,182 V196"/>
<path class="spine" marker-end="url(#ar-s-dark)" d="M224,211 H250 V113 H280"/>
<g class="node"><rect x="280" y="90" width="200" height="48" rx="10"/><text class="pn" x="294" y="111">repo-sync</text><text class="ps" x="294" y="129">GitHub issues</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M380,138 V158"/>
<g class="node"><rect x="280" y="158" width="200" height="48" rx="10"/><text class="pn" x="294" y="179">task-handoff</text><text class="ps" x="294" y="197">durable build context</text></g>
<path class="spine" marker-end="url(#ar-s-dark)" d="M480,182 H510 V62 H536"/>
<g class="node"><rect x="536" y="46" width="200" height="32" rx="10"/><text class="pn" x="550" y="67">build-phase</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M636,78 V100"/>
<g class="node"><rect x="536" y="100" width="200" height="126" rx="10"/><text class="pn" x="550" y="122">build-step x N</text><text class="ps" x="550" y="144">Inside EACH step:</text><text class="ps" x="550" y="164">implement / checks</text><text class="ps" x="550" y="184">review by selected lane</text><text class="ps" x="550" y="204">land / verify / finalize</text></g>
<path class="spine" marker-end="url(#ar-s-dark)" d="M736,163 H766 V110 H792"/>
<g class="node"><rect x="792" y="86" width="200" height="48" rx="10"/><text class="pn" x="806" y="107">acceptance</text><text class="ps" x="806" y="125">UAT / walkthrough</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M892,134 V160"/>
<g class="node"><rect x="792" y="160" width="200" height="48" rx="10"/><text class="pn" x="806" y="181">repo-update</text><text class="ps" x="806" y="199">docs / commit / push</text></g>
<text class="cap" x="24" y="254">plan-expedite: review &gt; redline &gt; wrap &gt; sync &gt; handoff. New repo? Run repo-init first.</text>
<text class="cap" x="24" y="272">Build-phase checkpoints eligible steps; acceptance follows the plan. This is the delivery overview, not every branch.</text>
</svg>
