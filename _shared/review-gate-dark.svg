<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 228" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,'Roboto Mono',monospace" role="img" aria-label="Inside one build step: a left-to-right loop. A developer agent in an isolated worktree, then automated gates (typecheck, lint, test), then five parallel independent reviewers, then a deterministic verdict that passes to merge, bounces needs-work back to the developer, or blocks when the iteration cap is hit.">
  <defs>
    <marker id="ar-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#384153"/></marker>
    <marker id="ar-s-dark" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6E9BFF"/></marker>
    <filter id="sh-dark" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,.5)"/></filter>
  </defs>
  <style>
    .bg{fill:#161C26;stroke:#29313F;stroke-width:1.5}
    .lnk{fill:none;stroke:#384153;stroke-width:1.7}
    .spine{fill:none;stroke:#6E9BFF;stroke-width:2.4}
    .node rect{fill:#161C26;stroke:#384153;stroke-width:1.4;filter:url(#sh-dark)}
    .pn{fill:#6E9BFF;font-size:13px;font-weight:600}
    .ps{fill:#7C8598;font-size:10.5px}
    .lbl{fill:#7C8598;font-size:11px;letter-spacing:.12em;font-weight:600}
    .cap{fill:#7C8598;font-size:10.5px}
  </style>
  <rect class="bg" x="6" y="6" width="1068" height="216" rx="16"/>
  <text class="lbl" x="24" y="28">ONE BUILD STEP</text>

  <g class="node"><rect x="658" y="44" width="180" height="30" rx="10"/><text class="pn" x="672" y="64">BLOCKED</text></g>
  <path class="lnk" marker-end="url(#ar-dark)" d="M748,90 L748,76"/>
  <text class="cap" x="846" y="64">iter cap</text>

  <path class="spine" marker-end="url(#ar-s-dark)" d="M208,114 L238,114"/>
  <path class="spine" marker-end="url(#ar-s-dark)" d="M418,114 L448,114"/>
  <path class="spine" marker-end="url(#ar-s-dark)" d="M628,114 L658,114"/>
  <path class="spine" marker-end="url(#ar-s-dark)" d="M838,114 L868,114"/>

  <g class="node"><rect x="28" y="90" width="180" height="48" rx="10"/><text class="pn" x="42" y="112">developer agent</text><text class="ps" x="42" y="129">isolated worktree</text></g>
  <g class="node"><rect x="238" y="90" width="180" height="48" rx="10"/><text class="pn" x="252" y="112">automated gates</text><text class="ps" x="252" y="129">type · lint · test</text></g>
  <g class="node"><rect x="448" y="90" width="180" height="48" rx="10"/><text class="pn" x="462" y="112">5 reviewers</text><text class="ps" x="462" y="129">1 per lens, parallel</text></g>
  <g class="node"><rect x="658" y="90" width="180" height="48" rx="10"/><text class="pn" x="672" y="112">verdict</text><text class="ps" x="672" y="129">deterministic</text></g>
  <g class="node"><rect x="868" y="90" width="180" height="48" rx="10"/><text class="pn" x="882" y="112">merge</text><text class="ps" x="882" y="129">+ post-merge gate</text></g>

  <path class="lnk" marker-end="url(#ar-dark)" d="M328,138 L328,172 L136,172 L136,138"/>
  <text class="cap" x="150" y="166">fail</text>
  <path class="lnk" marker-end="url(#ar-dark)" d="M700,138 L700,200 L100,200 L100,138"/>
  <text class="cap" x="360" y="194">needs-work</text>
</svg>
