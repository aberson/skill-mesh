<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" role="img" aria-label="Code-lane example: isolated developer, configured checks, five independent reviewers, strong orchestrator judge applying mandatory rules, and uncommitted landing. Full tests, ship checks, verification, restoration and cleanup precede final PASS. Fixable failures retry within budget; blocking conditions can occur throughout. Other reviewer lanes differ.">
  <defs>
    <marker id="ar-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#384153"/></marker>
    <marker id="ar-s-dark" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6E9BFF"/></marker>
    <filter id="sh-dark" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,.5)"/></filter>
  </defs>
  <style>
    .bg{fill:#161C26;stroke:#29313F;stroke-width:1.5}
    .lnk{fill:none;stroke:#384153;stroke-width:1.7}
    .spine{fill:none;stroke:#6E9BFF;stroke-width:2.4}
    .node rect{fill:#161C26;stroke:#384153;stroke-width:1.4;filter:url(#sh-dark)}
    .pn{fill:#6E9BFF;font-size:13px;font-weight:600}
    .ps{fill:#9AA5B8;font-size:10.5px}
    .lbl{fill:#9AA5B8;font-size:11px;letter-spacing:.12em;font-weight:600}
    .cap{fill:#9AA5B8;font-size:10.5px}
  </style>
<rect class="bg" x="6" y="6" width="1068" height="338" rx="16"/>

<text class="lbl" x="24" y="30">ONE BUILD STEP / CODE-LANE EXAMPLE</text>
<g class="node"><rect x="28" y="70" width="180" height="50" rx="10"/><text class="pn" x="42" y="91">developer agent</text><text class="ps" x="42" y="109">isolated worktree</text></g>
<g class="node"><rect x="238" y="70" width="180" height="50" rx="10"/><text class="pn" x="252" y="91">configured checks</text><text class="ps" x="252" y="109">tests / lint / types</text></g>
<g class="node"><rect x="448" y="70" width="180" height="50" rx="10"/><text class="pn" x="462" y="91">5 reviewers</text><text class="ps" x="462" y="109">fresh, parallel lenses</text></g>
<g class="node"><rect x="658" y="70" width="180" height="50" rx="10"/><text class="pn" x="672" y="91">orchestrator judge</text><text class="ps" x="672" y="109">strong / fixed rules</text></g>
<g class="node"><rect x="868" y="70" width="180" height="50" rx="10"/><text class="pn" x="882" y="91">land changes</text><text class="ps" x="882" y="109">uncommitted</text></g>
<path class="spine" marker-end="url(#ar-s-dark)" d="M208,95 H238"/>
<path class="spine" marker-end="url(#ar-s-dark)" d="M418,95 H448"/>
<path class="spine" marker-end="url(#ar-s-dark)" d="M628,95 H658"/>
<path class="spine" marker-end="url(#ar-s-dark)" d="M838,95 H868"/>
<path class="lnk" marker-end="url(#ar-dark)" d="M328,120 V150 H136 V120"/>
<text class="cap" x="150" y="144">fixable check failure</text>
<path class="lnk" marker-end="url(#ar-dark)" d="M748,120 V176 H100 V120"/>
<text class="cap" x="360" y="170">needs work: repair and retry within budget</text>
<path class="spine" marker-end="url(#ar-s-dark)" d="M958,120 V208"/>
<g class="node"><rect x="658" y="208" width="390" height="70" rx="10"/><text class="pn" x="672" y="229">Verify and finalize</text><text class="ps" x="672" y="247">full suite / ship checks / landed bytes</text></g>
<text class="ps" x="672" y="265">restore / archive / cleanup / final PASS*</text>
<text class="cap" x="28" y="222">BLOCKED can occur throughout:</text>
<text class="cap" x="28" y="241">missing capability, invalid evidence, exhausted budget,</text>
<text class="cap" x="28" y="260">ship race, conflict, or failed landing/finalization.</text>
<text class="cap" x="28" y="306">Other lanes: auto (default) = checks only; deep = review-deep; runtime = 3 arms; full = 8 arms.</text>
<text class="cap" x="28" y="328">*Passing runs may retain explicitly deferred UAT. Publishing is a later step; landing does not commit or push.</text>
</svg>
