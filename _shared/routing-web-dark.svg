<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 744" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,'Roboto Mono',monospace" role="img" aria-label="The routing web: an operator vent goes through user-gateway to thirteen routes: bug, do, plan, investigate, verify, trim, decide, draft, review, research, tend, session and learn. The plan route forks to plan-feature, plan-init or code-consigliere. Routes are a starting guess with nine re-route edges.">
  <defs>
    <marker id="ar-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#384153"/></marker>
    <filter id="sh-dark" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,.5)"/></filter>
  </defs>
  <style>
    .bg{fill:#161C26;stroke:#29313F;stroke-width:1.5}
    .fan{fill:none;stroke:#384153;stroke-width:1.5}
    .fork{fill:none;stroke:#6E9BFF;stroke-width:1.6}
    .rail rect{fill:#161C26;stroke:#384153;stroke-width:1.4;filter:url(#sh-dark)}
    .rail-name{fill:#6E9BFF;font-size:15px;font-weight:600}
    .rail-dest{fill:#7C8598;font-size:11.5px}
    .rail-sub{fill:#E3A542;font-size:11.5px}
    .innode rect{fill:#161C26;stroke:#384153;stroke-width:1.4;filter:url(#sh-dark)}
    .innode.gw rect{stroke:#6E9BFF;stroke-width:1.7}
    .in-t{fill:#A7B0C2;font-size:13px}
    .gw-cmd{fill:#6E9BFF;font-size:15px;font-weight:600}
    .gw-sub{fill:#7C8598;font-size:10.5px}
    .hub-t{fill:#E8ECF4;font-size:14px;font-weight:600}
    .hub-sub{fill:#7C8598;font-size:10.5px}
    .chip rect{fill:#1B2540;stroke:#6E9BFF;stroke-width:1.2}
    .chip-cmd{fill:#6E9BFF;font-size:12px;font-weight:600}
    .chip-lbl{fill:#7C8598;font-size:9.5px}
    .title{fill:#7C8598;font-size:11px;letter-spacing:.12em}
    .note{fill:#7C8598;font-size:11px}
  </style>
  <rect class="bg" x="6" y="6" width="1158" height="732" rx="16"/>
  <text class="title" x="28" y="40">THE ROUTING WEB · ONE VENT  →  THIRTEEN ROUTES</text>
  <g>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,81 376,81"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,129 376,129"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,177 376,177"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,225 376,225"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,273 376,273"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,321 376,321"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,369 376,369"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,417 376,417"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,465 376,465"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,513 376,513"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,561 376,561"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,609 376,609"/>
    <path class="fan" marker-end="url(#ar-dark)" d="M212,369 C 290,369 300,657 376,657"/>
  </g>
  <g class="innode vent"><rect x="28" y="171" width="152" height="38" rx="10"/><text class="in-t" x="44" y="195">operator vent</text></g>
  <path class="fan" marker-end="url(#ar-dark)" d="M104,209 L104,227"/>
  <g class="innode gw"><rect x="28" y="229" width="200" height="60" rx="12"/><text class="gw-cmd" x="44" y="255">/user-gateway</text><text class="gw-sub" x="44" y="273">one routed row per fragment</text></g>
  <path class="fan" marker-end="url(#ar-dark)" d="M128,289 L128,337"/>
  <g class="innode hub"><rect x="44" y="341" width="168" height="56" rx="12"/><text class="hub-t" x="60" y="365">routing web</text><text class="hub-sub" x="60" y="383">skill-pipeline.md</text></g>
  <g>
    <g class="rail"><rect x="380" y="62" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="86">bug</text><text class="rail-dest" x="520" y="86">/user-debug</text></g>
    <g class="rail"><rect x="380" y="110" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="134">do</text><text class="rail-dest" x="520" y="134">/user-pm  (its board picks the build route)</text></g>
    <g class="rail"><rect x="380" y="158" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="182">plan</text><text class="rail-sub" x="520" y="182">forks by situation  →</text></g>
    <g class="rail"><rect x="380" y="206" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="230">investigate</text><text class="rail-dest" x="520" y="230">/deep-research · Explore</text></g>
    <g class="rail"><rect x="380" y="254" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="278">verify</text><text class="rail-dest" x="520" y="278">/review-uat · /user-uat · /user-walkthrough [--shakedown]</text></g>
    <g class="rail"><rect x="380" y="302" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="326">trim</text><text class="rail-dest" x="520" y="326">/plan-merge --trim</text></g>
    <g class="rail"><rect x="380" y="350" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="374">decide</text><text class="rail-dest" x="520" y="374">parked for you · /user-dr · /user-fermize</text></g>
    <g class="rail"><rect x="380" y="398" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="422">draft</text><text class="rail-dest" x="520" y="422">/user-draft  →  /goal</text></g>
    <g class="rail"><rect x="380" y="446" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="470">review</text><text class="rail-dest" x="520" y="470">/review-gauntlet · /review-deep · /review-proof</text></g>
    <g class="rail"><rect x="380" y="494" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="518">research</text><text class="rail-dest" x="520" y="518">/research-prospect · /citation-*</text></g>
    <g class="rail"><rect x="380" y="542" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="566">tend</text><text class="rail-dest" x="520" y="566">/context-slim · /test-prune · /lesson-harvest · /user-afterparty</text></g>
    <g class="rail"><rect x="380" y="590" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="614">session</text><text class="rail-dest" x="520" y="614">/user-wrap · /task-handoff --resume · /user-pm</text></g>
    <g class="rail"><rect x="380" y="638" width="600" height="38" rx="10"/><text class="rail-name" x="396" y="662">learn</text><text class="rail-dest" x="520" y="662">/user-learn · /user-brainstorm</text></g>
  </g>
  <path class="fork" d="M980,177 C 990,177 988,127 998,127"/>
  <g class="chip"><rect x="998" y="112" width="150" height="30" rx="8"/><text class="chip-cmd" x="1010" y="125">/plan-feature</text><text class="chip-lbl" x="1010" y="137">existing project</text></g>
  <path class="fork" d="M980,177 C 990,177 988,177 998,177"/>
  <g class="chip"><rect x="998" y="162" width="150" height="30" rx="8"/><text class="chip-cmd" x="1010" y="175">/plan-init</text><text class="chip-lbl" x="1010" y="187">brand-new project</text></g>
  <path class="fork" d="M980,177 C 990,177 988,227 998,227"/>
  <g class="chip"><rect x="998" y="212" width="150" height="30" rx="8"/><text class="chip-cmd" x="1010" y="225">/code-consigliere</text><text class="chip-lbl" x="1010" y="237">understand it first</text></g>
  <text class="note" x="380" y="708">A route is a starting guess, not a cage: nine re-route edges, e.g. verify → bug,</text>
  <text class="note" x="380" y="725">investigate → plan, plan → trim, any → decide (skill-pipeline.md).</text>
</svg>