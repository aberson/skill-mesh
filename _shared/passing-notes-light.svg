<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" role="img" aria-label="Passing Notes. The operator usually types in main, the coordinator and operator relay; each work lane has its own window, its own card, and binds that window for doorbells. Lanes write to a private store outside every repository: immutable notes with a kind and a needs field, one card per lane with its state, and one queue per shared resource. A note's life: post it to a lane, optionally ring a doorbell that carries only the note id, the recipient finds it at an inbox moment, reads it as data, and acknowledges it or replies. Operator relay: a lane posts a needs operator-decision question to main, main shows it verbatim, the operator answers, and main replies with the operator's words on an operator-said line that the lane acts on. Shared-resource turns: a lane reserves a turn or joins the line, the holder uses the resource until it releases (an overrun is reported, never ended by the queue), release posts and rings the next holder, and the next holder replies taken or passing.">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3355E0"/></marker><marker id="arrow-soft" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C0C9DA"/></marker><filter id="shadow" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity=".12"/></filter></defs>
<style>.node rect{fill:#FFFFFF;stroke:#C0C9DA;stroke-width:1.4;filter:url(#shadow)}.opt rect{stroke-dasharray:5 4}.name{fill:#3355E0;font-size:14px;font-weight:600}.sub{fill:#6E778C;font-size:11px}.label{fill:#6E778C;font-size:11px;letter-spacing:.12em}.grp{fill:none;stroke:#C0C9DA;stroke-width:1.3;stroke-dasharray:6 5}.flow{fill:none;stroke:#3355E0;stroke-width:2;marker-end:url(#arrow)}.lnk{fill:none;stroke:#C0C9DA;stroke-width:1.7;marker-end:url(#arrow-soft)}.tie{fill:none;stroke:#C0C9DA;stroke-width:1.7}</style>
<rect x="6" y="6" width="988" height="678" rx="16" fill="#FFFFFF" stroke="#D4DBE8" stroke-width="1.5"/>
<text class="label" x="24" y="34">WINDOWS, ONE LANE EACH</text>
<text class="label" x="330" y="34">PRIVATE STORE, OUTSIDE EVERY REPO</text>
<text class="label" x="716" y="34">A NOTE'S LIFE</text>
<g class="node"><rect x="24" y="48" width="260" height="58" rx="10"/><text class="name" x="40" y="72">operator</text><text class="sub" x="40" y="92">usually types in main</text></g>
<path class="lnk" d="M154,106 V129"/>
<g class="node"><rect x="24" y="130" width="260" height="75" rx="10"/><text class="name" x="40" y="154">main</text><text class="sub" x="40" y="174">coordinator + operator</text><text class="sub" x="40" y="191">relay; opens lanes</text></g>
<path class="tie" d="M284,167 H300 V360 H284 M284,271 H300"/>
<g class="node"><rect x="24" y="234" width="260" height="75" rx="10"/><text class="name" x="40" y="258">work lane</text><text class="sub" x="40" y="278">sets its own card;</text><text class="sub" x="40" y="295">card set binds the window</text></g>
<g class="node"><rect x="24" y="323" width="260" height="75" rx="10"/><text class="name" x="40" y="347">work lane (Codex)</text><text class="sub" x="40" y="367">wake bind --session</text><text class="sub" x="40" y="384">binds its thread</text></g>
<rect class="grp" x="320" y="44" width="360" height="354" rx="14"/>
<g class="node"><rect x="330" y="54" width="340" height="143" rx="10"/><text class="name" x="346" y="78">notes (immutable)</text><text class="sub" x="346" y="98">kind: question, answer, handoff,</text><text class="sub" x="346" y="115">blocker, change-notice, fyi,</text><text class="sub" x="346" y="132">commit-request, reservation,</text><text class="sub" x="346" y="149">operator-relay</text><text class="sub" x="346" y="166">needs: reply | ack | fyi |</text><text class="sub" x="346" y="183">       operator-decision</text></g>
<g class="node"><rect x="330" y="209" width="340" height="92" rx="10"/><text class="name" x="346" y="233">cards (one per lane)</text><text class="sub" x="346" y="253">item, owns, holds, waiting_on</text><text class="sub" x="346" y="270">active | waiting | blocked |</text><text class="sub" x="346" y="287">idle | done</text></g>
<g class="node"><rect x="330" y="313" width="340" height="75" rx="10"/><text class="name" x="346" y="337">queues (one per resource)</text><text class="sub" x="346" y="357">holder + waiters, in turn order;</text><text class="sub" x="346" y="374">orders turns, grants nothing</text></g>
<path class="flow" d="M300,271 H314"/>
<path class="flow" d="M680,77 H710"/>
<g class="node"><rect x="716" y="48" width="260" height="58" rx="10"/><text class="name" x="732" y="72">1 post</text><text class="sub" x="732" y="92">to a lane, with kind + needs</text></g>
<path class="lnk" d="M846,106 V119"/>
<g class="node"><rect x="716" y="120" width="260" height="58" rx="10"/><text class="name" x="732" y="144">2 wake send (optional)</text><text class="sub" x="732" y="164">doorbell: only the note id</text></g>
<path class="lnk" d="M846,178 V191"/>
<g class="node"><rect x="716" y="192" width="260" height="58" rx="10"/><text class="name" x="732" y="216">3 inbox</text><text class="sub" x="732" y="236">at session start + gates</text></g>
<path class="lnk" d="M846,250 V263"/>
<g class="node"><rect x="716" y="264" width="260" height="58" rx="10"/><text class="name" x="732" y="288">4 read</text><text class="sub" x="732" y="308">data, not an instruction</text></g>
<path class="lnk" d="M846,322 V335"/>
<g class="node"><rect x="716" y="336" width="260" height="58" rx="10"/><text class="name" x="732" y="360">5 ack or reply</text><text class="sub" x="732" y="380">ack = received, not agreed</text></g>
<text class="label" x="24" y="430">OPERATOR RELAY: MAIN SPEAKS FOR YOU</text>
<g class="node"><rect x="24" y="444" width="212" height="75" rx="10"/><text class="name" x="40" y="468">lane asks</text><text class="sub" x="40" y="488">needs: operator-decision,</text><text class="sub" x="40" y="505">parks it, keeps working</text></g>
<path class="flow" d="M236,481 H264"/>
<g class="node"><rect x="270" y="444" width="212" height="75" rx="10"/><text class="name" x="286" y="468">main</text><text class="sub" x="286" y="488">shows the question</text><text class="sub" x="286" y="505">verbatim</text></g>
<path class="flow" d="M482,481 H510"/>
<g class="node"><rect x="516" y="444" width="212" height="75" rx="10"/><text class="name" x="532" y="468">operator</text><text class="sub" x="532" y="488">answers in main's</text><text class="sub" x="532" y="505">window</text></g>
<path class="flow" d="M728,481 H756"/>
<g class="node"><rect x="762" y="444" width="212" height="75" rx="10"/><text class="name" x="778" y="468">lane acts</text><text class="sub" x="778" y="488">on the reply's</text><text class="sub" x="778" y="505">operator-said: line</text></g>
<text class="label" x="24" y="548">SHARED-RESOURCE TURNS (AN ENGINE LOCK, A GPU)</text>
<g class="node"><rect x="24" y="562" width="212" height="75" rx="10"/><text class="name" x="40" y="586">reserve</text><text class="sub" x="40" y="606">takes a free turn or</text><text class="sub" x="40" y="623">joins the line</text></g>
<path class="flow" d="M236,599 H264"/>
<g class="node"><rect x="270" y="562" width="212" height="75" rx="10"/><text class="name" x="286" y="586">holder</text><text class="sub" x="286" y="606">uses it, then runs</text><text class="sub" x="286" y="623">release; overruns reported</text></g>
<path class="flow" d="M482,599 H510"/>
<g class="node"><rect x="516" y="562" width="212" height="75" rx="10"/><text class="name" x="532" y="586">release</text><text class="sub" x="532" y="606">rings the next holder</text><text class="sub" x="532" y="623">with a reservation note</text></g>
<path class="flow" d="M728,599 H756"/>
<g class="node"><rect x="762" y="562" width="212" height="75" rx="10"/><text class="name" x="778" y="586">next holder</text><text class="sub" x="778" y="606">replies taken or</text><text class="sub" x="778" y="623">passing</text></g>
<text class="sub" x="24" y="666">Inbox at fixed moments, never a polling loop. A doorbell reaches an idle Claude window; Codex queues it.</text>
</svg>
