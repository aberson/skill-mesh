<title id="title">user-dr</title>
<desc id="desc">A project&#x27;s plans, seeds and decision records become a theme-grouped register; each theme answer is checked for consequences and conflicts, confirmed if it reverses an earlier one, recorded verbatim, then filed or handed off.</desc>
